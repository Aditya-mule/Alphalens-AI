version: '3.8'

services:
  # Relational Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: alphalens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: alphalens_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alphalens_network

  # Caching and BullMQ Job Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: alphalens_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alphalens_network

  # Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:v1.6.1
    container_name: alphalens_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - alphalens_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  alphalens_network:
    driver: bridge
